services:
  frame-gallery:
    image: ghcr.io/bballdavis/frame-gallery:latest
    container_name: frame-gallery
    restart: unless-stopped
    # Host networking lets the app auto-discover Frame TVs. In bridge mode, swap this for
    # the ports below and add the TV's IP address in Settings.
    network_mode: host
    # ports:
    #   - "8005:8005"
    volumes:
      - frame_gallery_data:/data
    environment:
      - SECRET_KEY=change-me
      - FRAME_TV_DATA=/data
      # The port the web server listens on. With host networking, pick any free port.
      - PORT=8005

volumes:
  frame_gallery_data:
