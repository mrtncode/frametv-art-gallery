[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frametv-art-gallery"
version = "0.1.0"
description = "Self-hosted gallery manager for Samsung Frame TVs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [ { name = "mrtncode" } ]

dependencies = [
    "Flask==3.1.3",
    "Werkzeug==3.1.8",
    "samsungtvws==3.0.5",
    "gunicorn==26.2.0",
    "flask_sqlalchemy==3.1.1",
    "python-dotenv==1.2.3",
    "Flask-Migrate==4.1.0",
    "flask-cors==6.0.5",
    "Pillow==12.3.0",
    "aiohttp==3.14.3",
    "aiofiles==25.1.0",
    "aioimmich==0.17.0",
    "packaging==26.3"
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["app*"]
